[workspace]
resolver = "2"
members = [
    "crates/rekey-connector",
    "crates/rekey-domain",
    "crates/rekey-policy",
    "crates/rekey-vault",
    "crates/rekey-broker",
    "crates/rekey-cli",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/majiayu000/rekey"

[workspace.dependencies]
rekey-connector = { path = "crates/rekey-connector" }
rekey-domain = { path = "crates/rekey-domain" }
rekey-policy = { path = "crates/rekey-policy" }
rekey-vault = { path = "crates/rekey-vault" }
rekey-broker = { path = "crates/rekey-broker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = "1"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tempfile = "3"

[package]
name = "rekey-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration-test host for the Rekey local Credential Authority"
publish = false

[dependencies]
rekey-domain = { workspace = true }
rekey-vault = { workspace = true }
rekey-broker = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
aws-lc-rs = "1.18"
data-encoding = "2"
serde_jcs = "0.2"

[dev-dependencies]
zeroize = "1"
