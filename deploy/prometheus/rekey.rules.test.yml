# Executed by the official promtool engine; no imitation evaluator.
rule_files: [rekey.rules.yml]
evaluation_interval: 15s
# rate() may round 1 to its adjacent float; use promtool's last-mantissa-bit
# tolerance while retaining every series, label and alert expectation.
fuzzy_compare: true
tests:
  - name: "fresh publication and genuine zero errors"
    interval: 15s
    input_series:
      - series: "up{job=\"rekey-node\",instance=\"fixture\"}"
        values: "1+0x23"
      - series: "node_textfile_scrape_error{job=\"rekey-node\",instance=\"fixture\"}"
        values: "0+0x23"
      - series: "node_textfile_mtime_seconds{job=\"rekey-node\",instance=\"fixture\",file=\"/var/lib/rekey-metrics/rekey.prom\"}"
        values: "270+0x23"
      - series: "node_timex_sync_status{job=\"rekey-node\",instance=\"fixture\"}"
        values: "1+0x23"
      - series: "node_time_seconds{job=\"rekey-node\",instance=\"fixture\"}"
        values: "0+15x23"
      - series: "rekey_requests_total{job=\"rekey-node\",instance=\"fixture\",channel=\"admin\"}"
        values: "0+15x23"
      - series: "rekey_errors_total{job=\"rekey-node\",instance=\"fixture\",channel=\"admin\"}"
        values: "0+0x23"
    promql_expr_test:
      - expr: "rekey:metrics_fresh"
        eval_time: 5m
        exp_samples: [{"labels":"rekey:metrics_fresh{job=\"rekey-node\",instance=\"fixture\"}","value":1}]
      - expr: "rekey:requests_per_second"
        eval_time: 5m
        exp_samples: [{"labels":"rekey:requests_per_second{job=\"rekey-node\",instance=\"fixture\",channel=\"admin\"}","value":1}]
      - expr: "rekey:errors_per_second"
        eval_time: 5m
        exp_samples: [{"labels":"rekey:errors_per_second{job=\"rekey-node\",instance=\"fixture\",channel=\"admin\"}","value":0}]
      - expr: "rekey:metrics_file_mtime_seconds"
        eval_time: 5m
        exp_samples: [{"labels":"rekey:metrics_file_mtime_seconds{job=\"rekey-node\",instance=\"fixture\"}","value":270}]
    alert_rule_test:
      - eval_time: 5m
        alertname: RekeyMetricsUnavailable
        exp_alerts: []
      - eval_time: 5m
        alertname: RekeyMetricsTargetMissing
        exp_alerts: []
  - name: "publication exactly 60 seconds old remains fresh"
    interval: 15s
    input_series:
      - series: "up{job=\"rekey-node\",instance=\"fixture\"}"
        values: "1+0x23"
