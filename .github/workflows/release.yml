name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag commit to be reachable from protected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

  security-gate:
    needs: release-source
    uses: ./.github/workflows/security-gate.yml

  build:
    needs: security-gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - name: Validate tag, version, and runner architecture
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$(rustc -vV | awk '/^host:/ {print $2}')" == "${{ matrix.target }}" ]]
      - name: Build release binaries
        run: cargo build --locked --release -p rekey-cli --bin rekey -p rekey-broker --bin rekeyd --bin rekey-github-create-issue
      - name: Sign macOS binaries
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Apple signing secret: $name"
              exit 1
            fi
          done
          cert="$RUNNER_TEMP/rekey-developer-id.p12"
          keychain="$RUNNER_TEMP/rekey-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          for bin in rekey rekeyd rekey-github-create-issue; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "target/release/$bin"
            codesign --verify --strict "target/release/$bin"
          done
      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="rekey-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          stage="dist/rekey-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          install -m 0755 target/release/rekey target/release/rekeyd target/release/rekey-github-create-issue "$stage/"
          install -m 0755 scripts/rekey-service-unit.py "$stage/"
          install -m 0644 LICENSE README.md "$stage/"
          install -m 0644 CHANGELOG.md SECURITY.md SUPPORT.md "$stage/"
          mkdir -p "$stage/docs/product-foundation" "$stage/docs/releases" \
            "$stage/docs/superpowers/specs" "$stage/examples"
          install -m 0644 docs/alpha-scope.md docs/installation.md docs/user-guide.md \
            docs/operations-runbook.md "$stage/docs/"
          install -m 0644 docs/product-foundation/feature-truth-matrix.md \
            docs/product-foundation/threat-model-v2.md "$stage/docs/product-foundation/"
          install -m 0644 docs/releases/${GITHUB_REF_NAME}.md "$stage/docs/releases/"
          install -m 0644 \
            docs/superpowers/specs/2026-08-28-credential-authority-v2-foundation.md \
            docs/superpowers/specs/2026-09-02-password-lifecycle-p01.md \
            docs/superpowers/specs/2026-09-03-approvals-persistent-policy-p03.md \
            docs/superpowers/specs/2026-09-03-workload-identity-p04.md \
            docs/superpowers/specs/2026-09-04-agent-egress-launcher-p09.md \
            "$stage/docs/superpowers/specs/"
          install -m 0644 examples/github-create-issue.json "$stage/examples/"
          # Keep the shipped documentation links usable inside the archive.
          for doc in \
            apps/macos/README.md \
            docs/evidence/vault-kv-cloudflare-2026-09-10.json \
            docs/releases/v2.0.0-alpha.3.md \
            docs/superpowers/specs/2026-09-03-vault-dynamic-lease-source-p07b.md \
            docs/superpowers/specs/2026-09-10-approval-origin-authentication.md \
            docs/superpowers/specs/2026-09-10-external-backup-operations.md \
            docs/superpowers/specs/2026-09-10-external-policy-signer.md \
            docs/superpowers/specs/2026-09-10-github-actions-jwks.md \
            docs/superpowers/specs/2026-09-10-keycloak-token-exchange-oau02.md \
            docs/superpowers/specs/2026-09-10-local-approval-endpoint.md \
            docs/superpowers/specs/2026-09-10-local-approval-inbox.md \
            docs/superpowers/specs/2026-09-10-local-mcp-stdio.md \
            docs/superpowers/specs/2026-09-10-operator-credential-repair.md \
            docs/superpowers/specs/2026-09-10-remaining-p3-disposition.md \
            docs/superpowers/specs/2026-09-16-anthropic-text-stream.md \
            docs/superpowers/specs/2026-09-16-approval-review-ui.md \
            docs/superpowers/specs/2026-09-16-audit-prune.md \
            docs/superpowers/specs/2026-09-16-external-capabilities.md \
            docs/superpowers/specs/2026-09-16-github-reference-plugin.md \
            docs/superpowers/specs/2026-09-16-key04-dek-rotation.md \
            docs/superpowers/specs/2026-09-16-key04-vrk-rotation.md \
            docs/superpowers/specs/2026-09-16-local-metrics.md \
            ; do
            mkdir -p "$stage/$(dirname "$doc")"
            install -m 0644 "$doc" "$stage/$doc"
          done
          tar -czf "dist/$archive" -C dist "$(basename "$stage")"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ steps.package.outputs.stage }}
          format: spdx-json
          output-file: dist/${{ steps.package.outputs.archive }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}
      - name: Preserve provenance bundle
        run: cp "${{ steps.provenance.outputs.bundle-path }}" "dist/${{ steps.package.outputs.archive }}.provenance.intoto.jsonl"
      - name: Attest SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}
          sbom-path: dist/${{ steps.package.outputs.archive }}.spdx.json
      - name: Preserve SBOM attestation bundle
        run: cp "${{ steps.sbom-attestation.outputs.bundle-path }}" "dist/${{ steps.package.outputs.archive }}.sbom.intoto.jsonl"
      - name: Upload immutable build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rekey-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
            dist/${{ steps.package.outputs.archive }}.spdx.json
            dist/${{ steps.package.outputs.archive }}.provenance.intoto.jsonl
            dist/${{ steps.package.outputs.archive }}.sbom.intoto.jsonl
          if-no-files-found: error

  macos-ui:
    needs: security-gate
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - name: Require Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/rekey-ui-developer-id.p12"
          keychain_path="$RUNNER_TEMP/rekey-ui-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "REKEY_UI_SIGNING_KEYCHAIN=$keychain_path"
            echo "REKEY_UI_CERTIFICATE_PATH=$certificate_path"
          } >> "$GITHUB_ENV"
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - name: Build and sign Rekey.app
        env:
          REKEY_REQUIRE_DEVELOPER_ID: "1"
        run: scripts/build-macos-ui.sh
      - name: Notarize Rekey.app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          app="target/macos-ui/Rekey.app"
          zip="$RUNNER_TEMP/Rekey-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          xcrun notarytool submit "$zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          mkdir -p dist
          archive="rekey-${GITHUB_REF_NAME}-macos-app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${REKEY_UI_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$REKEY_UI_SIGNING_KEYCHAIN" || true
          fi
          rm -f "${REKEY_UI_CERTIFICATE_PATH:-}" "${APPLE_API_KEY_PATH:-}"
      - name: Upload immutable build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rekey-macos-app
          path: |
            dist/rekey-${{ github.ref_name }}-macos-app.zip
            dist/rekey-${{ github.ref_name }}-macos-app.zip.sha256
          if-no-files-found: error

  fresh-install:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install acceptance dependencies
        run: scripts/ci-install-release-smoke-deps.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rekey-${{ matrix.target }}
          path: downloaded
      - name: Exercise downloaded release artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="downloaded/rekey-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          scripts/release-smoke.sh "$archive" "$archive.sha256" "${GITHUB_REF_NAME#v}"
          mkdir installed
          tar -xzf "$archive" -C installed
          release_dir="$PWD/installed/rekey-${GITHUB_REF_NAME}-${{ matrix.target }}"
          BIN_DIR="$release_dir" \
          REKEY_SERVICE_GENERATOR="$release_dir/rekey-service-unit.py" \
          REKEY_SERVICE_MANAGED_DAEMON="$release_dir/rekeyd" \
          REKEY_SERVICE_REQUIRE_BINARIES=1 \
            scripts/p1-service-manager.sh

  publish:
    needs: [fresh-install, macos-ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rekey-*
          path: dist
          merge-multiple: true
      - name: Assemble release checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS
      - name: Publish only after every platform passed
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --prerelease \
            --verify-tag \
            --title "Rekey $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false

  public-url-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install acceptance dependencies
        run: scripts/ci-install-release-smoke-deps.sh
      - name: Download the public release artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="rekey-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" --dir downloaded \
            --pattern "$archive" \
            --pattern "$archive.sha256"
          gh attestation verify "downloaded/$archive" --repo "$GITHUB_REPOSITORY"
          scripts/release-smoke.sh \
            "downloaded/$archive" \
            "downloaded/$archive.sha256" \
            "${GITHUB_REF_NAME#v}"

  withdraw-on-public-smoke-failure:
    needs: [publish, public-url-smoke]
    if: ${{ always() && needs.publish.result == 'success' && needs.public-url-smoke.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Withdraw the failed prerelease without replacing its artifacts
        run: gh release edit "$GITHUB_REF_NAME" --draft --repo "$GITHUB_REPOSITORY"
