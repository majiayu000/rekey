name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag commit to be reachable from protected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

  security-gate:
    needs: release-source
    uses: ./.github/workflows/security-gate.yml

  build:
    needs: security-gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - name: Validate tag, version, and runner architecture
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$(rustc -vV | awk '/^host:/ {print $2}')" == "${{ matrix.target }}" ]]
      - name: Build release binaries
        run: cargo build --locked --release -p rekey-cli --bin rekey -p rekey-broker --bin rekeyd --bin rekey-mcp -p rekey-policy --bin rekey-policy-sign --bin rekey-approval-sign
      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="rekey-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          stage="dist/rekey-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          install -m 0755 target/release/rekey target/release/rekeyd \
            target/release/rekey-mcp target/release/rekey-policy-sign target/release/rekey-approval-sign "$stage/"
          install -m 0755 scripts/rekey-service-unit.py scripts/agent-quickstart.py \
            scripts/operator-credential-repair.py "$stage/"
          install -m 0644 LICENSE README.md "$stage/"
          install -m 0644 CHANGELOG.md SECURITY.md SUPPORT.md "$stage/"
          mkdir -p "$stage/docs/product-foundation" "$stage/docs/releases" \
            "$stage/docs/superpowers/specs" "$stage/examples"
          install -m 0644 docs/alpha-scope.md docs/installation.md docs/user-guide.md \
            docs/operations-runbook.md "$stage/docs/"
          install -m 0644 docs/product-foundation/feature-truth-matrix.md \
            docs/product-foundation/threat-model-v2.md "$stage/docs/product-foundation/"
          install -m 0644 docs/releases/${GITHUB_REF_NAME}.md "$stage/docs/releases/"
          install -m 0644 \
            docs/superpowers/specs/2026-08-28-credential-authority-v2-foundation.md \
            docs/superpowers/specs/2026-09-02-password-lifecycle-p01.md \
            docs/superpowers/specs/2026-09-03-approvals-persistent-policy-p03.md \
            docs/superpowers/specs/2026-09-03-workload-identity-p04.md \
            docs/superpowers/specs/2026-09-04-agent-egress-launcher-p09.md \
            "$stage/docs/superpowers/specs/"
          install -m 0644 examples/github-create-issue.json "$stage/examples/"
          # Keep the shipped documentation links usable inside the archive.
          for doc in \
            apps/macos/README.md \
            docs/evidence/vault-kv-cloudflare-2026-09-10.json \
            docs/releases/v2.0.0-alpha.3.md \
            docs/superpowers/specs/2026-09-03-vault-dynamic-lease-source-p07b.md \
            docs/superpowers/specs/2026-09-10-approval-origin-authentication.md \
            docs/superpowers/specs/2026-09-10-external-backup-operations.md \
            docs/superpowers/specs/2026-09-10-external-policy-signer.md \
            docs/superpowers/specs/2026-09-10-github-actions-jwks.md \
            docs/superpowers/specs/2026-09-10-keycloak-token-exchange-oau02.md \
            docs/superpowers/specs/2026-09-10-local-approval-endpoint.md \
            docs/superpowers/specs/2026-09-10-local-approval-inbox.md \
            docs/superpowers/specs/2026-09-10-local-mcp-stdio.md \
            docs/superpowers/specs/2026-09-10-operator-credential-repair.md \
            docs/superpowers/specs/2026-09-10-remaining-p3-disposition.md \
            docs/superpowers/specs/2026-09-16-anthropic-text-stream.md \
            docs/superpowers/specs/2026-09-16-action-plugin-registration.md \
            docs/superpowers/specs/2026-09-16-approval-review-ui.md \
            docs/superpowers/specs/2026-09-16-audit-prune.md \
            docs/superpowers/specs/2026-09-16-external-capabilities.md \
            docs/superpowers/specs/2026-09-16-github-reference-plugin.md \
            docs/superpowers/specs/2026-09-16-key04-dek-rotation.md \
            docs/superpowers/specs/2026-09-16-key04-vrk-rotation.md \
            docs/superpowers/specs/2026-09-16-local-isolation-and-streaming.md \
            docs/superpowers/specs/2026-09-16-local-metrics.md \
            docs/superpowers/specs/2026-09-16-native-action-plugin.md \
            docs/superpowers/specs/2026-09-30-audit-delivery.md \
            docs/superpowers/specs/2026-09-30-vault-lease-renewal.md \
            docs/superpowers/specs/2026-09-30-vault-transit-approval-signer.md \
            docs/superpowers/specs/2026-09-30-source-tool-packaging.md \
            docs/superpowers/specs/2026-09-30-remote-approval-relay.md \
            docs/superpowers/specs/2026-09-30-remote-approval-inbox.md \
            docs/superpowers/specs/2026-09-30-s3-audit-archive.md \
            docs/superpowers/specs/2026-09-30-vault-lease-journal.md \
            docs/superpowers/specs/2026-09-30-gcp-secret-source.md \
            docs/superpowers/specs/2026-09-30-aws-secret-source.md \
            docs/superpowers/specs/2026-09-30-azure-secret-source.md \
            docs/superpowers/specs/2026-09-30-http-header-ows-sealing.md \
            docs/superpowers/specs/2026-09-30-onepassword-secret-source.md \
            docs/superpowers/specs/2026-09-30-controlplane.md \
            docs/superpowers/specs/2026-09-30-identity-directory.md \
            docs/superpowers/specs/2026-09-30-oidc-admin.md \
            docs/superpowers/specs/2026-10-01-standby-backup-durability.md \
            docs/superpowers/specs/2026-10-01-snapshot-restore-cut.md \
            docs/superpowers/specs/2026-10-01-vault-kv-latest.md \
            docs/superpowers/specs/2026-10-01-vault-private-source.md \
            docs/superpowers/specs/2026-10-01-macos-keychain-source.md \
            docs/superpowers/specs/2026-10-01-vault-approle-source.md \
            docs/superpowers/specs/2026-09-30-decoded-source-bootstrap-sealing.md \
            docs/superpowers/specs/2026-09-30-metrics-deployment.md \
            docs/superpowers/specs/2026-09-30-native-policy-approval-flow.md \
            docs/superpowers/specs/2026-10-02-docker-dr-reference.md \
            docs/superpowers/specs/2026-10-01-pkcs11-approval-signer.md \
            docs/superpowers/specs/2026-10-01-unlocked-audit-retention.md \
            docs/superpowers/specs/2026-10-02-rekey-v3-personal-first.md \
            docs/superpowers/plans/2026-10-03-v3-implementation.md \
            docs/evidence/local-capabilities-2026-10-02.json \
            deploy/prometheus/rekey.rules.yml \
            deploy/prometheus/rekey.rules.test.yml \
            deploy/prometheus/rekey.scrape.example.yml \
            ; do
            mkdir -p "$stage/$(dirname "$doc")"
            install -m 0644 "$doc" "$stage/$doc"
          done
          tar -czf "dist/$archive" -C dist "$(basename "$stage")"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ steps.package.outputs.stage }}
          format: spdx-json
          output-file: dist/${{ steps.package.outputs.archive }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}
      - name: Preserve provenance bundle
        run: cp "${{ steps.provenance.outputs.bundle-path }}" "dist/${{ steps.package.outputs.archive }}.provenance.intoto.jsonl"
      - name: Attest SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}
          sbom-path: dist/${{ steps.package.outputs.archive }}.spdx.json
      - name: Preserve SBOM attestation bundle
        run: cp "${{ steps.sbom-attestation.outputs.bundle-path }}" "dist/${{ steps.package.outputs.archive }}.sbom.intoto.jsonl"
      - name: Upload immutable build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rekey-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
            dist/${{ steps.package.outputs.archive }}.spdx.json
            dist/${{ steps.package.outputs.archive }}.provenance.intoto.jsonl
            dist/${{ steps.package.outputs.archive }}.sbom.intoto.jsonl
          if-no-files-found: error

  macos-ui:
    needs: security-gate
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Set temporary signing paths
        run: |
          printf '%s\n' \
            "REKEY_UI_SIGNING_KEYCHAIN=$RUNNER_TEMP/rekey-ui-signing.keychain-db" \
            "REKEY_UI_CERTIFICATE_PATH=$RUNNER_TEMP/rekey-ui-developer-id.p12" \
            "REKEY_PROVISIONING_PROFILE=$RUNNER_TEMP/rekey-app.provisionprofile" \
            "REKEY_DAEMON_PROVISIONING_PROFILE=$RUNNER_TEMP/rekey-daemon.provisionprofile" \
            "REKEY_INSTALLER_CERTIFICATE_PATH=$RUNNER_TEMP/rekey-installer-developer-id.p12" \
            "APPLE_API_KEY_PATH=$RUNNER_TEMP/rekey-notary-api-key.p8" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - name: Validate package tag, version, and runner architecture
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --offline --no-deps --format-version 1 | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"] == "rekey-cli" and p["id"] in m["workspace_members"]))')"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$(rustc -vV | awk '/^host:/ {print $2}')" == "aarch64-apple-darwin" ]]
      - name: Check package and profile structure
        run: |
          python3 scripts/test-macos-profile.py
          python3 scripts/test-macos-pkg.py
          python3 scripts/test-v3-distribution.py
      - name: Require Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_DAEMON_PROVISIONING_PROFILE: ${{ secrets.APPLE_DAEMON_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_INSTALLER_CERTIFICATE \
            APPLE_INSTALLER_CERTIFICATE_PASSWORD \
            APPLE_INSTALLER_SIGNING_IDENTITY \
            APPLE_PROVISIONING_PROFILE \
            APPLE_DAEMON_PROVISIONING_PROFILE \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Import Developer ID Application and Installer certificates
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$REKEY_UI_CERTIFICATE_PATH"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$REKEY_INSTALLER_CERTIFICATE_PATH"
          security create-keychain -p "$keychain_password" "$REKEY_UI_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$REKEY_UI_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$REKEY_UI_SIGNING_KEYCHAIN"
          security import "$REKEY_UI_CERTIFICATE_PATH" -k "$REKEY_UI_SIGNING_KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$REKEY_INSTALLER_CERTIFICATE_PATH" -k "$REKEY_UI_SIGNING_KEYCHAIN" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$REKEY_UI_SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$REKEY_UI_SIGNING_KEYCHAIN" login.keychain-db
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$APPLE_API_KEY_PATH"
      - name: Write separate Developer ID App and daemon provisioning profiles
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_DAEMON_PROVISIONING_PROFILE: ${{ secrets.APPLE_DAEMON_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$REKEY_PROVISIONING_PROFILE"
          printf '%s' "$APPLE_DAEMON_PROVISIONING_PROFILE" | base64 --decode > "$REKEY_DAEMON_PROVISIONING_PROFILE"
      - name: Build and sign Rekey.app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          REKEY_REQUIRE_DEVELOPER_ID: "1"
        run: scripts/build-macos-ui.sh
      - name: Notarize Rekey.app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          app="target/macos-ui/Rekey.app"
          zip="$RUNNER_TEMP/Rekey-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          xcrun notarytool submit "$zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          mkdir -p dist
      - name: Build, sign, and notarize the Installer package
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          scripts/build-macos-pkg.sh \
            --app target/macos-ui/Rekey.app \
            --output-dir target/macos-pkg \
            --installer-identity "$APPLE_INSTALLER_SIGNING_IDENTITY"
          package="rekey-${GITHUB_REF_NAME}-macos.pkg"
          mv "target/macos-pkg/Rekey-${GITHUB_REF_NAME#v}.pkg" "dist/$package"
          xcrun notarytool submit "dist/$package" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "dist/$package"
          xcrun stapler validate "dist/$package"
          pkgutil --check-signature "dist/$package"
          spctl --assess --type install --verbose=4 "dist/$package"
          (cd dist && shasum -a 256 "$package" > "$package.sha256")
      - name: Generate cask from the final notarized package
        run: |
          set -euo pipefail
          python3 scripts/generate-homebrew-cask.py \
            --package "dist/rekey-${GITHUB_REF_NAME}-macos.pkg" \
            --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY" > dist/rekey.rb
          ruby -c dist/rekey.rb
          (cd dist && shasum -a 256 rekey.rb > rekey.rb.sha256)
      - name: Generate package SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: target/macos-ui/Rekey.app
          format: spdx-json
          output-file: dist/rekey-${{ github.ref_name }}-macos.pkg.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest package build provenance
        id: pkg-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/rekey-${{ github.ref_name }}-macos.pkg
      - name: Preserve package provenance bundle
        run: cp "${{ steps.pkg-provenance.outputs.bundle-path }}" "dist/rekey-${GITHUB_REF_NAME}-macos.pkg.provenance.intoto.jsonl"
      - name: Attest package SBOM
        id: pkg-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/rekey-${{ github.ref_name }}-macos.pkg
          sbom-path: dist/rekey-${{ github.ref_name }}-macos.pkg.spdx.json
      - name: Preserve package SBOM attestation bundle
        run: cp "${{ steps.pkg-sbom.outputs.bundle-path }}" "dist/rekey-${GITHUB_REF_NAME}-macos.pkg.sbom.intoto.jsonl"
      - name: Remove temporary signing material
        if: always()
        run: |
          status=0
          if [ -e "$REKEY_UI_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$REKEY_UI_SIGNING_KEYCHAIN" || status=1
          fi
          rm -f "$REKEY_UI_CERTIFICATE_PATH" "$REKEY_INSTALLER_CERTIFICATE_PATH" "$REKEY_PROVISIONING_PROFILE" "$REKEY_DAEMON_PROVISIONING_PROFILE" \
            "$APPLE_API_KEY_PATH" "$RUNNER_TEMP/Rekey-notarize.zip" || status=1
          exit "$status"
      - name: Upload immutable build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rekey-macos-pkg
          path: |
            dist/rekey-${{ github.ref_name }}-macos.pkg
            dist/rekey-${{ github.ref_name }}-macos.pkg.sha256
            dist/rekey-${{ github.ref_name }}-macos.pkg.spdx.json
            dist/rekey-${{ github.ref_name }}-macos.pkg.provenance.intoto.jsonl
            dist/rekey-${{ github.ref_name }}-macos.pkg.sbom.intoto.jsonl
            dist/rekey.rb
            dist/rekey.rb.sha256
          if-no-files-found: error

  fresh-install:
    needs: [build, macos-ui]
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install acceptance dependencies
        run: scripts/ci-install-release-smoke-deps.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os != 'macOS'
        with:
          name: rekey-${{ matrix.target }}
          path: downloaded
      - name: Exercise downloaded release artifact
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="downloaded/rekey-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          scripts/release-smoke.sh "$archive" "$archive.sha256" "${GITHUB_REF_NAME#v}"
          mkdir installed
          tar -xzf "$archive" -C installed
          release_dir="$PWD/installed/rekey-${GITHUB_REF_NAME}-${{ matrix.target }}"
          BIN_DIR="$release_dir" \
          REKEY_SERVICE_GENERATOR="$release_dir/rekey-service-unit.py" \
          REKEY_SERVICE_MANAGED_DAEMON="$release_dir/rekeyd" \
          REKEY_SERVICE_REQUIRE_BINARIES=1 \
            scripts/p1-service-manager.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os == 'macOS'
        with:
          name: rekey-macos-pkg
          path: downloaded
      - name: Exercise downloaded notarized package
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          package="downloaded/rekey-${GITHUB_REF_NAME}-macos.pkg"
          gh attestation verify "$package" --repo "$GITHUB_REPOSITORY"
          python3 scripts/generate-homebrew-cask.py --package "$package" \
            --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY" > expected-rekey.rb
          cmp expected-rekey.rb downloaded/rekey.rb
          python3 scripts/test-macos-pkg.py --install-smoke \
            --package "$package" --checksum "$package.sha256" --version "${GITHUB_REF_NAME#v}"

  publish:
    needs: [fresh-install, macos-ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rekey-*
          path: dist
          merge-multiple: true
      - name: Assemble release checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS
      - name: Publish only after every platform passed
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --prerelease \
            --verify-tag \
            --title "Rekey $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false

  public-url-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install acceptance dependencies
        run: scripts/ci-install-release-smoke-deps.sh
      - name: Download the public release artifact
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="rekey-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" --dir downloaded \
            --pattern "$archive" \
            --pattern "$archive.sha256"
          gh attestation verify "downloaded/$archive" --repo "$GITHUB_REPOSITORY"
          scripts/release-smoke.sh \
            "downloaded/$archive" \
            "downloaded/$archive.sha256" \
            "${GITHUB_REF_NAME#v}"
      - name: Download and install the public notarized package
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          package="rekey-${GITHUB_REF_NAME}-macos.pkg"
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" --dir downloaded \
            --pattern "$package" --pattern "$package.sha256" --pattern rekey.rb
          gh attestation verify "downloaded/$package" --repo "$GITHUB_REPOSITORY"
          python3 scripts/generate-homebrew-cask.py --package "downloaded/$package" \
            --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY" > expected-rekey.rb
          cmp expected-rekey.rb downloaded/rekey.rb
          python3 scripts/test-macos-pkg.py --install-smoke \
            --package "downloaded/$package" --checksum "downloaded/$package.sha256" --version "${GITHUB_REF_NAME#v}"

  withdraw-on-public-smoke-failure:
    needs: [publish, public-url-smoke]
    if: ${{ always() && needs.publish.result == 'success' && needs.public-url-smoke.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Withdraw the failed prerelease without replacing its artifacts
        run: gh release edit "$GITHUB_REF_NAME" --draft --repo "$GITHUB_REPOSITORY"
