name: security-gate

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0:
    name: P0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Default personal build; enterprise reserve is checked by lab-weekly.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux acceptance dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Install macOS acceptance dependencies
        if: runner.os == 'macOS'
        run: scripts/ci-install-release-smoke-deps.sh

      - name: Workspace contracts
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Connection, CLI, MCP and workspace tests
        run: |
          # Deadline fixtures must reach their intended phase without competing KDF jobs.
          cargo test --workspace --offline -- --test-threads=1
      - name: Connection onboarding through real CLI and daemon
        run: |
          REKEY_QUICKSTART_REAL=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-agent-quickstart.py

      - name: Real ENOSPC fault injection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mount_dir="$(mktemp -d)"
          cleanup() {
            sudo umount "$mount_dir" || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          sudo mount -t tmpfs -o "size=32m,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$mount_dir"
          REKEY_ENOSPC_DIR="$mount_dir" \
            cargo test -p rekey-vault --test enospc_faults -- --test-threads=1 --nocapture

      - name: Dependency boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          if rg -n 'REKEY_PASSWORD|get_secret_value|/proxy/|passthrough' crates tests src; then
            exit 1
          fi
          if rg -n 'get_secret\b|read_secret|export_secret' crates/rekey-domain crates/rekey-broker crates/rekey-cli; then
            exit 1
          fi
          if cargo tree -p rekey-cli -e normal | rg 'rusqlite|aes-gcm|argon2|reqwest|rekey-vault|rekey-broker|rekey-connector'; then
            exit 1
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Dependency audit
        run: cargo audit

      - name: Runtime fail-stop acceptance
        run: scripts/p0-runtime-faults.sh
      - name: Backup and restore durability acceptance
        if: runner.os == 'macOS'
        run: scripts/p0-durability.sh
      - name: P5 connector SDK contract acceptance
        run: scripts/p5-connector-sdk.sh

      - name: Native macOS Connection and CLI contracts
        if: runner.os == 'macOS'
        run: |
          # These are software contracts; real Touch ID and Secure Enclave remain a manual gate.
          scripts/build-macos-ui.sh
          xcrun swiftc -warnings-as-errors -swift-version 5 -O \
            -framework SwiftUI -framework AppKit -framework ServiceManagement \
            apps/macos/BackgroundService.swift apps/macos/PolicySigning.swift apps/macos/PresenceKey.swift apps/macos/Model.swift apps/macos/Tests/ConnectionContract.swift -o /tmp/rekey-connection-contract
          /tmp/rekey-connection-contract
          xcrun swiftc -warnings-as-errors -swift-version 5 -O \
            -framework SwiftUI -framework AppKit -framework ServiceManagement \
            apps/macos/BackgroundService.swift apps/macos/PolicySigning.swift apps/macos/PresenceKey.swift apps/macos/Model.swift scripts/test-macos-ui.swift -o /tmp/rekey-ui-contract
          # CLI_BINARY runs the Connection signing and subprocess boundary contracts together.
          /tmp/rekey-ui-contract target/macos-ui/Rekey.app/Contents/Resources/bin/rekey
          mkdir -p /tmp/RekeyStartupContract.app/Contents/MacOS
          cp /tmp/rekey-ui-contract /tmp/RekeyStartupContract.app/Contents/MacOS/RekeyStartupContract
          ln -s "$PWD/target/macos-ui/Rekey.app/Contents/Resources" /tmp/RekeyStartupContract.app/Contents/Resources
          /tmp/RekeyStartupContract.app/Contents/MacOS/RekeyStartupContract --startup-only
          python3 scripts/test-human-vault.py target/macos-ui/Rekey.app/Contents/Resources/bin/rekey
