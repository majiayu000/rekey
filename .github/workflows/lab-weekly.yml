name: lab-weekly

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Enterprise reserve compile (${{ matrix.os }}); archived runtime fixtures unverified
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Enterprise reserve compile (archived runtime fixtures unverified)
        run: |
          cargo check --workspace --all-targets --features lab
          cargo clippy --workspace --all-targets --features lab -- -D warnings

      - name: Archived runtime harness syntax only (not acceptance)
        shell: bash
        run: |
          set -euo pipefail
          # Legacy Action/Profile/run/G2 and enterprise fixtures must be updated together
          # with their commands (--features lab) and policy-7 fields before runtime reuse.
          for script in \
            scripts/p0-acceptance.sh \
            scripts/p0-crash-recovery.sh \
            scripts/p1-policy-acceptance.sh \
            scripts/p3-approval-acceptance.sh \
            scripts/p1-streaming-sealing.sh \
            scripts/p2-github-app.sh \
            scripts/p1-service-manager.sh \
            scripts/p9-linux-agent-run.sh \
            scripts/p1-linux-g2.sh \
            scripts/p4-workload-identity-acceptance.sh \
            scripts/p6-github-app-extension.sh \
            scripts/p7-vault-kv-source.sh \
            scripts/p7-vault-dynamic-source.sh \
            scripts/p7-vault-oss-interop.sh; do
            bash -n "$script"
          done
          python3 - <<'PYTHON'
          import ast
          from pathlib import Path
          for name in (
              "test-macos-profile.py", "test-mcp-live.py", "dogfood-vault.py",
              "test-audit-delivery.py", "test-audit-archive.py", "test-controlplane.py",
              "test-approval-signer-live.py", "p7-vault-journal-recovery.py",
              "test-metrics-deployment.py", "test-keychain-live.py",
              "test-docker-dr-drill.py", "rekey-docker-dr-drill.py",
          ):
              path = Path("scripts") / name
              ast.parse(path.read_text(), filename=str(path))
          PYTHON
          # Docker recovery source remains at scripts/Dockerfile.dr; no weekly runtime claim.
          echo '::notice::Enterprise reserve compile and archived harness syntax only; Action/Profile/run/G2/controlplane/DR runtime fixtures remain unverified for 0.4.'
