[package]
name = "rekey-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Encrypted SQLite credential vault and authority worker for Rekey"
publish = false

[dependencies]
rekey-domain = { workspace = true }
rekey-policy = { workspace = true }
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
aws-lc-rs = "1.18"
data-encoding = "2"
hkdf = "0.12"
libc = "0.2"
rand = "0.9.3"
rusqlite = { version = "0.34", features = ["bundled", "backup"] }
secrecy = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
subtle = "2"
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false, optional = true }
security-framework-sys = { version = "=2.17.0", default-features = false, features = ["OSX_10_15"] }
core-foundation = { version = "=0.10.1" }

[features]
default = []
lab = ["rekey-policy/lab", "dep:security-framework"]
