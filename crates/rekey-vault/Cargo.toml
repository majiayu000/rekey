[package]
name = "rekey-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Encrypted SQLite credential vault and authority worker for Rekey"
publish = false

[dependencies]
rekey-domain = { workspace = true }
aes-gcm = "0.10"
argon2 = "0.5"
data-encoding = "2"
hkdf = "0.12"
libc = "0.2"
rand = "0.9.3"
rusqlite = { version = "0.34", features = ["bundled", "backup"] }
secrecy = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
subtle = "2"
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
