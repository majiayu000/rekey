[package]
name = "rekey-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IPC-only command-line client for Rekey"
publish = false

[[bin]]
name = "rekey"
path = "src/main.rs"

# Contract: this crate is an IPC client only. It must never depend on
# rusqlite, aes-gcm, argon2, reqwest, or rekey-vault/rekey-broker; offline
# bootstrap and the broker itself live in the separate `rekeyd` binary.
[dependencies]
rekey-domain = { workspace = true }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rand = "0.9.3"
rpassword = "7.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }
aws-lc-rs = "1.18"
data-encoding = "2"
serde_jcs = "0.2"
