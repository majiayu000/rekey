[package]
name = "rekey-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rekey"
path = "src/main.rs"

# Contract: this crate is an IPC client only. It must never depend on
# rusqlite, aes-gcm, argon2, reqwest, or rekey-vault/rekey-broker; offline
# bootstrap and the broker itself live in the separate `rekeyd` binary.
[dependencies]
rekey-domain = { workspace = true }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rpassword = "7"
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }
